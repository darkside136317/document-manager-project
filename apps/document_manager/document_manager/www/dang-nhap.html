{% extends "templates/reader/base.html" %}
{% from "templates/reader/macros.html" import icon %}

{% block main %}{% autoescape true %}
<div class="card card-narrow" style="margin-top: 24px" x-data="loginForm({ redirect: {{ redirect | tojson | forceescape }} })">
  <div class="card-body stack">
    <div>
      <h1>Đăng nhập</h1>
      <p class="muted" style="margin: 4px 0 0">Dành cho độc giả và cán bộ của {{ org.name }}.</p>
    </div>
    <form class="stack" @submit.prevent="submit()" novalidate>
      <div class="alert alert-danger" x-show="error" x-cloak role="alert">{{ icon("triangle-alert") }}<span x-text="error"></span></div>
      <div class="field">
        <label for="usr">Email đăng nhập</label>
        <input id="usr" class="input" type="email" autocomplete="username" inputmode="email" required x-model="usr" autofocus>
      </div>
      <div class="field">
        <label for="pwd">Mật khẩu</label>
        <div class="copy-box">
          <input id="pwd" class="input" :type="show ? 'text' : 'password'" autocomplete="current-password" required x-model="pwd" style="font-family: inherit; font-size: 1rem">
          <button class="btn" type="button" @click="show = !show" :aria-pressed="show" aria-label="Hiện hoặc ẩn mật khẩu">{{ icon("eye") }}</button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" :disabled="busy">
        <span x-show="busy" x-cloak>{{ icon("loader", "spin") }}</span> Đăng nhập
      </button>
    </form>
    <div class="cluster-between small">
      <a href="/quen-mat-khau">Quên mật khẩu?</a>
      <a href="/dang-ky">Chưa có tài khoản? Đăng ký</a>
    </div>
  </div>
</div>
{% endautoescape %}{% endblock %}
