<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{ title }}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1f35'/%3E%3Cpath d='M7 10h18v4H7zM9 14h14v10H9z' fill='%23d4af37'/%3E%3Crect x='13' y='17' width='6' height='2' rx='1' fill='%230a1f35'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/assets/document_manager/css/theme-tokens.css">
    {% for href in dm_css %}<link rel="stylesheet" href="{{ href }}">
    {% endfor %}
</head>
<body>
    <div id="app">
        {% if not dm_js %}
        <p style="font-family: system-ui, sans-serif; margin: 48px auto; max-width: 560px; line-height: 1.5;">
            Giao diện cán bộ chưa được build. Chạy <code>npm install &amp;&amp; npm run build</code> trong thư mục
            <code>apps/document_manager/frontend</code> (hoặc build lại image Docker), rồi tải lại trang.
        </p>
        {% endif %}
    </div>
    <script>window.__DM_BOOT__ = {{ boot_json | safe }};</script>
    {% for src in dm_js %}<script type="module" src="{{ src }}"></script>
    {% endfor %}
</body>
</html>
