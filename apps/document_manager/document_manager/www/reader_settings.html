{% extends "templates/dm_portal_base.html" %}

{% block page_actions %}
{% if can_edit %}
<button type="button" class="dm-btn primary" id="btnSave">
    <i class="fa fa-save"></i> Lưu Thay Đổi
</button>
{% endif %}
{% endblock %}

{% block dm_content %}
<div class="dm-card" style="padding: 24px;">
    <form id="frmReaderSettings">
        
        <h3 class="dm-section-title"><i class="fa fa-sliders"></i> Giới hạn Khai thác</h3>
        <div class="dm-form-grid">
            <div class="dm-form-group">
                <label class="dm-form-label">Số Phiếu Yêu cầu Khai thác tối đa/ngày</label>
                <input type="number" name="max_requests_per_day" class="dm-form-control" value="{{ doc.max_requests_per_day if doc.max_requests_per_day is not none else '5' }}" {% if not can_edit %}disabled{% endif %}>
            </div>
            <div class="dm-form-group">
                <label class="dm-form-label">Số Phiếu Sao chụp tối đa/ngày</label>
                <input type="number" name="max_copy_requests_per_day" class="dm-form-control" value="{{ doc.max_copy_requests_per_day if doc.max_copy_requests_per_day is not none else '3' }}" {% if not can_edit %}disabled{% endif %}>
            </div>
            <div class="dm-form-group">
                <label class="dm-form-label">Thời gian giữ tài liệu (ngày)</label>
                <input type="number" name="document_hold_days" class="dm-form-control" value="{{ doc.document_hold_days if doc.document_hold_days is not none else '7' }}" {% if not can_edit %}disabled{% endif %}>
            </div>
            <div class="dm-form-group" style="grid-column: 1 / -1;">
                <label class="dm-checkbox-label">
                    <input type="checkbox" name="auto_return_overdue" value="1" {% if doc.auto_return_overdue %}checked{% endif %} {% if not can_edit %}disabled{% endif %}>
                    Tự động nhắc trả tài liệu khi quá hạn
                </label>
            </div>
        </div>

        <h3 class="dm-section-title" style="margin-top: 32px;"><i class="fa fa-user-plus"></i> Đăng ký Độc giả</h3>
        <div class="dm-form-grid">
            <div class="dm-form-group" style="grid-column: 1 / -1;">
                <label class="dm-checkbox-label">
                    <input type="checkbox" name="allow_self_registration" value="1" {% if doc.allow_self_registration %}checked{% endif %} {% if not can_edit %}disabled{% endif %}>
                    Cho phép độc giả tự đăng ký tài khoản (qua Cổng thông tin)
                </label>
            </div>
            <div class="dm-form-group" style="grid-column: 1 / -1;">
                <label class="dm-checkbox-label">
                    <input type="checkbox" name="require_approval" value="1" {% if doc.require_approval %}checked{% endif %} {% if not can_edit %}disabled{% endif %}>
                    Yêu cầu cán bộ phê duyệt khi đăng ký mới
                </label>
            </div>
        </div>

    </form>
</div>
{% endblock %}

{% block dm_scripts %}
<div id="dm-context-data" data-can-edit="{{ 1 if can_edit else 0 }}" style="display: none;"></div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var contextEl = document.getElementById("dm-context-data");
        var canEdit = contextEl && contextEl.getAttribute("data-can-edit") === "1";
        
        if (!canEdit) return;
        var btnSave = document.getElementById("btnSave");
        if(btnSave) {
            btnSave.addEventListener("click", function() {
                var form = document.getElementById("frmReaderSettings");
                var formData = new FormData(form);
                var data = {};
                formData.forEach(function(value, key) { data[key] = value; });
                
                // Handle checkboxes
                form.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
                    data[cb.name] = cb.checked ? 1 : 0;
                });
                
                btnSave.disabled = true;
                btnSave.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Đang lưu...';
                
                frappe.call({
                    type: "POST",
                    method: "frappe.client.set_value",
                    args: {
                        doctype: "Reader Settings",
                        name: "Reader Settings",
                        fieldname: data
                    },
                    callback: function(r) {
                        btnSave.disabled = false;
                        btnSave.innerHTML = '<i class="fa fa-save"></i> Lưu Thay Đổi';
                        if(!r.exc) {
                            frappe.msgprint({title: "Thành công", message: "Đã lưu thiết lập độc giả", indicator: "green"});
                            setTimeout(function() { window.location.reload(); }, 1500);
                        } else {
                            var errMsg = "Có lỗi xảy ra";
                            if (r.exc) {
                                try {
                                    var excArr = JSON.parse(r.exc);
                                    var match = excArr[0].match(/frappe\.exceptions\.\w+: (.*)/);
                                    if (match) errMsg = match[1];
                                } catch(e) {}
                            }
                            frappe.msgprint({title: "Lỗi", message: errMsg, indicator: "red"});
                        }
                    }
                });
            });
        }
    });
</script>
{% endblock %}
