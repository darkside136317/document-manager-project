{% extends base_template or "templates/dm_portal_base.html" %}

{% block page_actions %}
<a href="{{ cfg.route }}" class="dm-btn"><i class="fa fa-arrow-left"></i> Quay lại</a>
{% if not doc and not needs_profile %}
<button type="button" class="dm-btn primary" onclick="dmSubmitFeedback()"><i class="fa fa-paper-plane"></i> Gửi Góp ý</button>
{% endif %}
{% endblock %}

{% block dm_content %}
{% include "templates/includes/dm_feedback_form.html" %}
{% endblock %}

{% block dm_scripts %}
<script>
    window.DM_REQUEST = {{ {"doctype": cfg.doctype, "route": cfg.route} | tojson }};
    {% if doc and is_staff and state == 'Mới' %}
    // Staff opening a new feedback marks it as seen (POST, not a side effect of GET).
    frappe.ready(function() {
        dmCall('document_manager.document_manager.api.requests.apply_action',
               {doctype: window.DM_REQUEST.doctype, name: {{ doc.name | tojson }}, action: 'Đánh dấu đã xem'}).then(function() {
            var badge = document.getElementById('state-badge');
            if (badge) { badge.textContent = 'Đã xem'; badge.className = 'dm-badge'; }
            document.querySelectorAll('[data-action="Đánh dấu đã xem"]').forEach(function(b) { b.remove(); });
        }).catch(function() {});
    });
    {% endif %}
</script>
{% endblock %}
