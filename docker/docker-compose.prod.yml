# =============================================================================
# Docker Compose PRODUCTION Override
# =============================================================================
# Usage: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
# This overrides the base compose with production-specific settings.
# =============================================================================

services:
  # Use custom-built image with document_manager app
  backend:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: always
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
    ports:
      - "${HTTP_PUBLISH_PORT:-127.0.0.1:8080}:8080"
    deploy:
      resources:
        limits:
          memory: 512M

  websocket:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: always

  queue-long:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  queue-short:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: always

  scheduler:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: always

  configurator:
    image: docmanager-custom:${ERPNEXT_VERSION:?}

  create-site:
    image: docmanager-custom:${ERPNEXT_VERSION:?}

  db:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  meilisearch:
    restart: always
    environment:
      MEILI_ENV: production
      MEILI_MAX_INDEXING_MEMORY: 1GiB
    deploy:
      resources:
        limits:
          memory: 1G
