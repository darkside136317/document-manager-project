# =============================================================================
# Docker Compose PRODUCTION Override
# =============================================================================
# Usage: python3 ../scripts/prod_compose.py up -d
# This overrides the base compose with production-specific settings.
# =============================================================================

services:
  # Use custom-built image with document_manager app
  backend:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: always
    # Allows PDFLUENT_API_URL=http://host.docker.internal:8000 when PDFluent
    # runs on the same server. External HTTPS endpoints work without this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: always
    # The sites volume contains private uploads on the host SSD. Nginx only
    # needs read access; backend and workers retain write access in the base file.
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
    ports:
      - "${HTTP_PUBLISH_PORT:-127.0.0.1:8080}:8080"
    deploy:
      resources:
        limits:
          memory: 512M

  websocket:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: always

  queue-long:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: always
    # AI jobs are dispatched by this worker, so it needs the same route.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2G

  queue-short:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: always

  scheduler:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: always

  configurator:
    image: docmanager-custom:${ERPNEXT_VERSION:?}

  create-site:
    image: docmanager-custom:${ERPNEXT_VERSION:?}

  db:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  meilisearch:
    # Search index persists on the named volume from the base Compose file.
    # Keep the API private to frappe_network; do not publish port 7700.
    image: getmeili/meilisearch:v1.12
    expose:
      - "7700"
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?set MEILISEARCH_MASTER_KEY in .env.prod}
      MEILI_ENV: production
      MEILI_MAX_INDEXING_MEMORY: 512MiB
    volumes:
      - meilisearch-data:/meili_data
    deploy:
      resources:
        limits:
          memory: 1G
