# Optional production object storage. Loaded only when MINIO_MODE is auto or manual.
x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  # Keep the search image explicit in the production stack with MinIO enabled.
  meilisearch:
    image: getmeili/meilisearch:v1.12
    expose:
      - "7700"

  backend:
    depends_on:
      minio-backfill:
        condition: service_completed_successfully
    environment: &minio-app-env
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?}
      MINIO_BUCKET: ${MINIO_BUCKET:?}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?}

  queue-long:
    depends_on:
      minio-backfill:
        condition: service_completed_successfully
    environment: *minio-app-env

  queue-short:
    # Manual MinIO may run on the same Docker host.
    extra_hosts: *host-gateway
    depends_on:
      minio-backfill:
        condition: service_completed_successfully
    environment: *minio-app-env

  scheduler:
    extra_hosts: *host-gateway
    depends_on:
      minio-backfill:
        condition: service_completed_successfully
    environment: *minio-app-env

  # Community release supports distributed clusters; this deployment uses one SSD.
  # Use manual mode for an existing server or distributed cluster.
  minio:
    profiles: [auto]
    image: docmanager-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: minio
      dockerfile: Dockerfile.server
    restart: always
    command: server /data --console-address :9001
    expose:
      - "9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    networks:
      - frappe_network

  minio-init:
    image: docmanager-minio-mc:RELEASE.2025-08-13T08-35-41Z
    build:
      context: minio
      dockerfile: Dockerfile.mc
    restart: "no"
    extra_hosts: *host-gateway
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$MINIO_MODE" in
          auto)
            tries=0
            until mc alias set local "$$MINIO_ENDPOINT" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
              tries=$$((tries + 1))
              if [ "$$tries" -ge 60 ]; then exit 1; fi
              sleep 2
            done
            mc mb --ignore-existing "local/$$MINIO_BUCKET"
            if ! mc admin user info local "$$MINIO_APP_ACCESS_KEY" >/dev/null 2>&1; then
              mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY"
            fi
            if ! mc admin policy info local document-manager >/dev/null 2>&1; then
              mc admin policy create local document-manager /policy/app.json
            fi
            mc admin policy attach local document-manager --user "$$MINIO_APP_ACCESS_KEY"
            ;;
          manual) ;;
          *) echo "Invalid MINIO_MODE: $$MINIO_MODE" >&2; exit 1 ;;
        esac
        mc alias set app "$$MINIO_ENDPOINT" "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY"
        mc ls "app/$$MINIO_BUCKET" >/dev/null
        probe="app/$$MINIO_BUCKET/.document-manager-check-$$(cat /proc/sys/kernel/random/uuid)"
        printf 'ok' | mc pipe "$$probe" >/dev/null
        mc stat "$$probe" >/dev/null
        mc cat "$$probe" >/dev/null
        mc rm "$$probe" >/dev/null
    environment:
      MINIO_MODE: ${MINIO_MODE:?}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?}
      MINIO_BUCKET: ${MINIO_BUCKET:?}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?}
      MC_CONFIG_DIR: /tmp/mc
    volumes:
      - ./minio/app-policy.json:/policy/app.json:ro
    tmpfs:
      - /tmp
    networks:
      - frappe_network

  # One-shot, resumable import of existing Frappe private files into MinIO.
  minio-backfill:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    restart: "no"
    extra_hosts: *host-gateway
    command:
      - bash
      - -ec
      - bench --site "$$FRAPPE_SITE_NAME" execute document_manager.document_manager.services.object_backfill.run
    environment:
      FRAPPE_SITE_NAME: ${FRAPPE_SITE_NAME:?}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?}
      MINIO_BUCKET: ${MINIO_BUCKET:?}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?}
      LEGACY_MONGODB_ATLAS_URI: ${MONGODB_ATLAS_URI:-}
      LEGACY_MONGODB_DATABASE: ${MONGODB_DATABASE:-docmanager_files}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe_network
    depends_on:
      create-site:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

volumes:
  minio-data:
    name: ${DATA_VOLUME_PREFIX:-docmanager}_minio
