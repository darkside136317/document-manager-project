# =============================================================================
# Document Manager — Docker Compose
# =============================================================================
# Hệ thống Quản lý & Khai thác Hồ sơ Lưu trữ Số hóa
# Based on frappe_docker pwd.yml, extended with Meilisearch + MinIO
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Frappe Backend (Gunicorn)
  # ---------------------------------------------------------------------------
  backend:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ERPNEXT_VERSION: ${ERPNEXT_VERSION:?}
    networks:
      - frappe_network
    restart: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: "${DB_PORT:-3306}"
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

  # ---------------------------------------------------------------------------
  # Configurator — one-shot: writes common_site_config.json
  # ---------------------------------------------------------------------------
  configurator:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    networks:
      - frappe_network
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -g meilisearch_host "$$MEILISEARCH_HOST";
        bench set-config -g meilisearch_master_key "$$MEILISEARCH_MASTER_KEY";
        bench set-config -g mongodb_atlas_uri "$$MONGODB_ATLAS_URI";
        bench set-config -g mongodb_database "$$MONGODB_DATABASE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: "${DB_PORT:-3306}"
      REDIS_CACHE: ${REDIS_CACHE:-redis-cache:6379}
      REDIS_QUEUE: ${REDIS_QUEUE:-redis-queue:6379}
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-http://meilisearch:7700}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?}
      MONGODB_ATLAS_URI: ${MONGODB_ATLAS_URI:?}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-docmanager_files}
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  # ---------------------------------------------------------------------------
  # Create Site — one-shot: creates the Frappe site with ERPNext
  # ---------------------------------------------------------------------------
  create-site:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    networks:
      - frappe_network
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        bench new-site ${FRAPPE_SITE_NAME:-docmanager.local} --mariadb-user-host-login-scope='%' --admin-password=${ADMIN_PASSWORD:-admin} --db-root-username=root --db-root-password=${MARIADB_ROOT_PASSWORD:?} --install-app erpnext --install-app document_manager --set-default;
    depends_on:
      configurator:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # MariaDB
  # ---------------------------------------------------------------------------
  db:
    image: mariadb:11.8
    networks:
      - frappe_network
    restart: on-failure
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
    volumes:
      - db-data:/var/lib/mysql
      - ./mariadb/my_custom.cnf:/etc/mysql/conf.d/my_custom.cnf:ro

  # ---------------------------------------------------------------------------
  # Nginx Frontend (reverse proxy + static files)
  # ---------------------------------------------------------------------------
  frontend:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    networks:
      - frappe_network
    restart: on-failure
    depends_on:
      - backend
      - websocket
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME:-$$host}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "${HTTP_PUBLISH_PORT:-8080}:8080"

  # ---------------------------------------------------------------------------
  # WebSocket (Socket.IO for real-time updates)
  # ---------------------------------------------------------------------------
  websocket:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    networks:
      - frappe_network
    restart: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://${REDIS_CACHE:-redis-cache:6379}
      FRAPPE_REDIS_QUEUE: redis://${REDIS_QUEUE:-redis-queue:6379}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis-cache:
    image: redis:7-alpine
    networks:
      - frappe_network
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Redis Queue
  # ---------------------------------------------------------------------------
  redis-queue:
    image: redis:7-alpine
    networks:
      - frappe_network
    restart: on-failure
    volumes:
      - redis-queue-data:/data

  # ---------------------------------------------------------------------------
  # Worker — Long-running jobs (text extraction, backup, large reports)
  # ---------------------------------------------------------------------------
  queue-long:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    networks:
      - frappe_network
    restart: on-failure
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://${REDIS_CACHE:-redis-cache:6379}
      FRAPPE_REDIS_QUEUE: redis://${REDIS_QUEUE:-redis-queue:6379}

  # ---------------------------------------------------------------------------
  # Worker — Short jobs (index sync, notifications)
  # ---------------------------------------------------------------------------
  queue-short:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    networks:
      - frappe_network
    restart: on-failure
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://${REDIS_CACHE:-redis-cache:6379}
      FRAPPE_REDIS_QUEUE: redis://${REDIS_QUEUE:-redis-queue:6379}

  # ---------------------------------------------------------------------------
  # Scheduler (cron-like scheduled tasks)
  # ---------------------------------------------------------------------------
  scheduler:
    image: docmanager-custom:${ERPNEXT_VERSION:?}
    networks:
      - frappe_network
    restart: on-failure
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  # ---------------------------------------------------------------------------
  # Meilisearch — Full-text Search Engine
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.12
    networks:
      - frappe_network
    restart: on-failure
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-changeme_meili_master_key}
      MEILI_ENV: production
      MEILI_MAX_INDEXING_MEMORY: 512MiB
    volumes:
      - meilisearch-data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # NOTE: File Storage uses MongoDB Atlas (cloud) via GridFS.
  # No local container needed — connection via MONGODB_ATLAS_URI in .env
  # ---------------------------------------------------------------------------

# =============================================================================
# Volumes — separated for independent backup
# =============================================================================
volumes:
  db-data:
    name: docmanager_db_data
  redis-queue-data:
    name: docmanager_redis_queue
  sites:
    name: docmanager_sites
  logs:
    name: docmanager_logs
  meilisearch-data:
    name: docmanager_meilisearch


# =============================================================================
# Network
# =============================================================================
networks:
  frappe_network:
    name: docmanager_network
    driver: bridge
